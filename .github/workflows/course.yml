name: Bilingual course

on:
  pull_request:
    branches: [master]
    paths: ['website/**', 'slides/**', 'labs/registration/**', 'scripts/**', 'tests/**', 'package*.json', '*.config.mjs', '.nvmrc', '.github/workflows/course.yml']
  push:
    branches: [master, 'codex/bilingual-pilot']
    paths: ['website/**', 'slides/**', 'labs/registration/**', 'scripts/**', 'tests/**', 'package*.json', '*.config.mjs', '.nvmrc', '.github/workflows/course.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the tested course to GitHub Pages (master only)
        type: boolean
        default: false

permissions:
  contents: read
  pages: read

concurrency:
  group: course-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Read current Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/pages --jq '{html_url,build_type,source}'
      - run: npm test
      - run: npm run lab:test
      - run: npm run lab:solution
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run audit
      - name: Save Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-results/
      - name: Save browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Save reviewable website
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-course
          path: dist/
          include-hidden-files: true
      - name: Package Pages site
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested course
        id: deployment
        uses: actions/deploy-pages@v4
