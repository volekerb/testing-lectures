name: Bilingual course

on:
  pull_request:
    branches: [master]
    paths: ['website/**', 'slides/**', 'labs/registration/**', 'scripts/**', 'tests/**', 'package*.json', '*.config.mjs', '.nvmrc', '.github/workflows/course.yml']
  push:
    branches: [master]
    paths: ['website/**', 'slides/**', 'labs/registration/**', 'scripts/**', 'tests/**', 'package*.json', '*.config.mjs', '.nvmrc', '.github/workflows/course.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the tested course to GitHub Pages (master only)
        type: boolean
        default: false

permissions:
  contents: read
  pages: read

concurrency:
  group: course-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Read current Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/pages --jq '{html_url,build_type,source}'
      - run: npm test
      - run: npm run lab:test
      - run: npm run lab:solution
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run audit
      - name: Save Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-results/
      - name: Save browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Save reviewable website
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-course
          path: dist/
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bilingual-course
          path: dist
      - name: Verify existing Pages destination
        id: pages
        run: |
          gh api repos/${{ github.repository }}/pages > /tmp/course-pages.json
          jq -e '.build_type == "legacy" and .source.branch == "gh-pages" and .source.path == "/"' /tmp/course-pages.json
          echo "cname=$(jq -r '.cname // empty' /tmp/course-pages.json)" >> "$GITHUB_OUTPUT"
      - name: Publish tested static files
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist
          cname: ${{ steps.pages.outputs.cname }}
          force_orphan: false
      - name: Request and verify the Pages build
        run: |
          expected_commit=$(gh api repos/${{ github.repository }}/git/ref/heads/gh-pages --jq .object.sha)
          gh api --method POST repos/${{ github.repository }}/pages/builds --jq .status
          for attempt in $(seq 1 60); do
            gh api repos/${{ github.repository }}/pages/builds/latest > /tmp/course-pages-build.json
            build_commit=$(jq -r .commit /tmp/course-pages-build.json)
            build_status=$(jq -r .status /tmp/course-pages-build.json)
            if [ "$build_commit" = "$expected_commit" ] && [ "$build_status" = "built" ]; then
              echo "Published tested commit $expected_commit"
              exit 0
            fi
            if [ "$build_commit" = "$expected_commit" ] && [ "$build_status" = "errored" ]; then
              jq .error /tmp/course-pages-build.json
              exit 1
            fi
            sleep 5
          done
          echo "Pages did not finish publishing the expected commit in time"
          exit 1
